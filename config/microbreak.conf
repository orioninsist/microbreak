# Microbreak Configuration


# Core System
# Enables the main background timer system
microbreak_timer=true


# Main Features
# These features are available and controlled by Microbreak
focus_mode=true
pomodoro_mode=true
screen_rest=true


# Statistics
# Saves daily usagqe information
statistics=true


# Automatic Health Reminder Interval
# 2700 seconds = 45 minutes
# Recommended interval for regular screen breaks
timer_seconds=2700


# Sound Notifications
# Optional audio notification support
sound_enabled=true
sound_file="/mnt/local/areas/microbreak/bf3-Solomons-theme.wav"


# Desktop Notification
# Notification display duration
notification_timeout=15


# Focus Mode
# Standard focused work duration
# 25 minutes is a balanced deep work period
focus_duration=25

# Application used for focus tracking
focus_app=code


# Pomodoro Mode
# Standard Pomodoro workflow:
# 25 minutes work + 5 minutes break
pomodoro_work_duration=25
pomodoro_break_duration=5

# Number of Pomodoro cycles
# 4 cycles = one complete Pomodoro session
pomodoro_cycles=4


# Screen Rest
# Eye rest duration
# 20 seconds follows the 20-20-20 eye care principle
screen_rest_seconds=20


# Voice System
# Local offline Piper text-to-speech
voice_enabled=true
voice_model="$HOME/piper-voices/en_US-amy-medium.onnx"


